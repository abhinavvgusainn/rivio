name: Rivio

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.35.0

  # File / Storage
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  open_filex: ^4.7.0

  # Charts
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  audioplayers: ^6.8.1
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift code generation
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
